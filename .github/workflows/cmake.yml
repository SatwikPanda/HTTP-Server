name: Portable milestone tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
      
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DREQUIRE_ALL_MILESTONES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Verify completed milestones (pending suites cannot pass)
        run: ctest --test-dir build -C Release -L "milestone0[1234]" --output-on-failure
